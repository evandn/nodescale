name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @nodescale/console build
        env:
          NODESCALE_ALLOW_UNPINNED_GATE: "1"

  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gate/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Includes integration tests against the runner's Docker daemon.
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o /tmp/nodescale-gate ./cmd/nodescale-gate

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # Runs the generated install script on the runner and drives the installed
  # setgid gate through `su nodescale`, exactly as Tailscale SSH does.
  server-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gate/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker pull alpine:3.20
      - run: sudo -E env "PATH=$PATH" sh test/integration/server-install.sh

  # Browser → Worker → relay (dev mode) → su nodescale → setgid gate → Docker.
  e2e:
    runs-on: ubuntu-24.04
    needs: [typescript, gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gate/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g playwright@1 && playwright install --with-deps chromium
      - run: docker pull alpine:3.20 && docker pull nginx:alpine
      - run: mkdir -p e2e-out && NODESCALE_ALLOW_UNPINNED_GATE=1 sudo -E env "PATH=$PATH" NODE_PATH="$(npm root -g)" E2E_OUT="$PWD/e2e-out" sh test/e2e/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-out
